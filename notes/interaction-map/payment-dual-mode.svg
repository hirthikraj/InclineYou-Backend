<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-label="Payment flow branches on the client's payment mode: trainer-collects generates a UPI deep link that either party can confirm, gym-collects is a manual mark-paid by the trainer" class="dg"><style>
svg{color:#15162B;font-family:'DejaVu Sans Mono',Menlo,Consolas,monospace}
text{fill:currentColor}
.box{fill:none;stroke:currentColor;stroke-width:1.4}
.box-fill{fill:#F0F2F8;stroke:currentColor;stroke-width:1.4}
.ln{stroke:currentColor;stroke-width:1.4;fill:none}
.acc{stroke:#4F46E5;color:#4F46E5}
.acc-box{fill:#E9ECFF;stroke:#4F46E5;stroke-width:1.5}
.acc-txt{fill:#4F46E5}
.muted-txt{fill:#767D96}
.lbl{font-size:11px}
.ttl{font-size:13px;font-weight:600}
.sm{font-size:10.5px}
.dash{stroke-dasharray:5 4}
</style>
<rect width="920" height="380" fill="#FFFFFF"/>
        <defs>
          <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
          </marker>
          <marker id="ar3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/>
          </marker>
        </defs>
        <rect class="box-fill" x="330" y="14" width="260" height="52" rx="4"/>
        <text class="ttl" x="460" y="38" text-anchor="middle">Amount due on a package</text>
        <text class="sm muted-txt" x="460" y="54" text-anchor="middle">session pack or monthly</text>

        <path class="ln" d="M460 66 L 460 96"/>
        <path class="box" d="M460 96 L 610 136 L 460 176 L 310 136 Z"/>
        <text class="ttl" x="460" y="132" text-anchor="middle">client.payment_mode</text>
        <text class="sm muted-txt" x="460" y="148" text-anchor="middle">set once, when the client is added</text>

        <line class="ln acc" x1="310" y1="136" x2="200" y2="136" marker-end="url(#ar3-a)"/>
        <text class="lbl acc-txt" x="255" y="126" text-anchor="middle">trainer_collects</text>
        <line class="ln" x1="610" y1="136" x2="720" y2="136" marker-end="url(#ar3)"/>
        <text class="lbl" x="665" y="126" text-anchor="middle">gym_collects</text>

        <rect class="acc-box" x="20" y="176" width="180" height="60" rx="4"/>
        <text class="ttl acc-txt" x="110" y="200" text-anchor="middle">UPI intent link</text>
        <text class="sm acc-txt" x="110" y="216" text-anchor="middle">to the trainer's own VPA</text>
        <line class="ln acc" x1="110" y1="146" x2="110" y2="176" marker-end="url(#ar3-a)"/>

        <line class="ln acc" x1="110" y1="236" x2="110" y2="266" marker-end="url(#ar3-a)"/>
        <rect class="box" x="20" y="266" width="180" height="60" rx="4"/>
        <text class="ttl" x="110" y="290" text-anchor="middle">any UPI app</text>
        <text class="sm muted-txt" x="110" y="306" text-anchor="middle">GPay · PhonePe · Paytm</text>

        <line class="ln" x1="200" y1="296" x2="290" y2="296" marker-end="url(#ar3)"/>
        <rect class="box-fill" x="290" y="266" width="230" height="60" rx="4"/>
        <text class="ttl" x="405" y="290" text-anchor="middle">either party marks paid</text>
        <text class="sm muted-txt" x="405" y="306" text-anchor="middle">optional UPI reference</text>

        <rect class="box" x="720" y="176" width="180" height="60" rx="4"/>
        <text class="ttl" x="810" y="200" text-anchor="middle">no link shown</text>
        <text class="sm muted-txt" x="810" y="216" text-anchor="middle">client pays the counter</text>
        <line class="ln" x1="810" y1="146" x2="810" y2="176" marker-end="url(#ar3)"/>

        <line class="ln" x1="810" y1="236" x2="810" y2="266" marker-end="url(#ar3)"/>
        <rect class="box" x="700" y="266" width="200" height="60" rx="4"/>
        <text class="ttl" x="800" y="290" text-anchor="middle">trainer marks paid</text>
        <text class="sm muted-txt" x="800" y="306" text-anchor="middle">+ send a reminder</text>

        <line class="ln" x1="405" y1="326" x2="405" y2="352" marker-end="url(#ar3)"/>
        <line class="ln" x1="800" y1="326" x2="560" y2="352" marker-end="url(#ar3)"/>
        <rect class="box-fill" x="250" y="352" width="310" height="26" rx="4"/>
        <text class="ttl" x="405" y="370" text-anchor="middle">payment row · append-only ledger</text>
      </svg>