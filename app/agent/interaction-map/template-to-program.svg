<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="Assigning a template deep-copies its structure into a per-client program; edits to a program never write back to the template or to other clients" class="dg"><style>
svg{color:#15162B;font-family:'DejaVu Sans Mono',Menlo,Consolas,monospace}
text{fill:currentColor}
.box{fill:none;stroke:currentColor;stroke-width:1.4}
.box-fill{fill:#F0F2F8;stroke:currentColor;stroke-width:1.4}
.ln{stroke:currentColor;stroke-width:1.4;fill:none}
.acc{stroke:#4F46E5;color:#4F46E5}
.acc-box{fill:#E9ECFF;stroke:#4F46E5;stroke-width:1.5}
.acc-txt{fill:#4F46E5}
.muted-txt{fill:#767D96}
.lbl{font-size:11px}
.ttl{font-size:13px;font-weight:600}
.sm{font-size:10.5px}
.dash{stroke-dasharray:5 4}
</style>
<rect width="920" height="280" fill="#FFFFFF"/>
        <defs>
          <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
          </marker>
          <marker id="ar2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/>
          </marker>
        </defs>
        <rect class="box-fill" x="20" y="100" width="190" height="80" rx="4"/>
        <text class="ttl" x="115" y="128" text-anchor="middle">Template</text>
        <text class="sm muted-txt" x="115" y="146" text-anchor="middle">trainer-owned blueprint</text>
        <text class="sm muted-txt" x="115" y="162" text-anchor="middle">days · exercises · targets</text>

        <line class="ln acc" x1="210" y1="126" x2="380" y2="66" marker-end="url(#ar2-a)"/>
        <line class="ln acc" x1="210" y1="154" x2="380" y2="214" marker-end="url(#ar2-a)"/>
        <text class="lbl acc-txt" x="295" y="86" text-anchor="middle">assign</text>
        <text class="lbl acc-txt" x="295" y="200" text-anchor="middle">assign</text>
        <text class="sm muted-txt" x="295" y="140" text-anchor="middle">deep copy, once</text>

        <rect class="box" x="380" y="30" width="220" height="76" rx="4"/>
        <text class="ttl" x="490" y="56" text-anchor="middle">Program · Priya</text>
        <text class="sm muted-txt" x="490" y="74" text-anchor="middle">squat 3×8–12 → <tspan class="acc-txt">3×5 @ 60kg</tspan></text>
        <text class="sm muted-txt" x="490" y="90" text-anchor="middle">tweaked for her knee load</text>

        <rect class="box" x="380" y="178" width="220" height="76" rx="4"/>
        <text class="ttl" x="490" y="204" text-anchor="middle">Program · Karthik</text>
        <text class="sm muted-txt" x="490" y="222" text-anchor="middle">squat 3×8–12</text>
        <text class="sm muted-txt" x="490" y="238" text-anchor="middle">untouched by Priya's edit</text>

        <path class="ln dash" d="M470 106 C 420 140, 260 140, 215 132"/>
        <line class="ln" x1="330" y1="126" x2="348" y2="144"/>
        <line class="ln" x1="348" y1="126" x2="330" y2="144"/>
        <text class="lbl" x="339" y="164" text-anchor="middle">never writes back</text>

        <rect class="box" x="660" y="30" width="240" height="76" rx="4"/>
        <text class="ttl" x="780" y="56" text-anchor="middle">Editing the template later</text>
        <text class="sm muted-txt" x="780" y="74" text-anchor="middle">does <tspan class="acc-txt">not</tspan> change assigned</text>
        <text class="sm muted-txt" x="780" y="90" text-anchor="middle">programs — see Q2</text>
        <line class="ln dash" x1="600" y1="68" x2="660" y2="68" marker-end="url(#ar2)"/>
      </svg>