services:
  postgres:
    image: postgres:16-alpine
    container_name: xrep-postgres
    environment:
      POSTGRES_DB: xrepdb
      POSTGRES_USER: xrep
      POSTGRES_PASSWORD: xrep_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xrep -d xrepdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
