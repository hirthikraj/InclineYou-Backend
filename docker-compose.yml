services:
  postgres:
    image: postgres:16-alpine
    container_name: trainx-postgres
    environment:
      POSTGRES_DB: trainxdb
      POSTGRES_USER: trainx
      POSTGRES_PASSWORD: trainx_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainx -d trainxdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
