name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xrepdb
          POSTGRES_USER: xrep
          POSTGRES_PASSWORD: xrep_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xrep -d xrepdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/xrepdb
          DATABASE_USERNAME: xrep
          DATABASE_PASSWORD: xrep_dev
          JWT_SECRET: ci-only-secret-not-used-anywhere-real-32chars

  app:
    name: App (typecheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: TypeScript
        working-directory: app
        run: npm run typecheck
