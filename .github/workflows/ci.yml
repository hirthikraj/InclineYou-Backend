name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job, not two. In the monorepo this workflow also typechecks the Expo
# client; this repository is the backend alone, so that job has nowhere to run
# and is deliberately absent rather than commented out.
#
# There is no Redis service here, and that is the same choice the monorepo
# makes: the suite runs on the Postgres OTP store and in-process rate-limit
# buckets. Anything that only works with Redis present passes locally and fails
# — or silently skips — here.
jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xrepdb
          POSTGRES_USER: xrep
          POSTGRES_PASSWORD: xrep_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xrep -d xrepdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/xrepdb
          # Flyway and the suite connect as the schema OWNER, which BYPASSES
          # row-level security — that is by design (V42 deliberately does not use
          # FORCE ROW LEVEL SECURITY, or every migration that backfills across
          # tenants would silently do nothing).
          #
          # `TenantIsolationTest` therefore opens its own connections as
          # APP_DB_USERNAME, the non-owning runtime login V42 creates. Without
          # that role every isolation assertion would pass for the wrong reason,
          # which is the one kind of green worth engineering against.
          # The OWNER pair. Flyway needs it, and so does the suite — the dev
          # runtime is behind the policies but the tests cannot be, because a
          # @Transactional test holds one connection borrowed before any request
          # exists. TENANCY.md has the argument.
          MIGRATION_DB_USERNAME: xrep
          MIGRATION_DB_PASSWORD: xrep_dev
          # The APP pair. Nothing in CI opens a pool with it — the suite is on
          # the owner — but V42 sets this password on the role it creates, and
          # TenantIsolationTest logs in with it to prove the wall.
          APP_DB_USERNAME: xrep_app
          APP_DB_PASSWORD: ci_only_app_role_password
          JWT_SECRET: ci-only-secret-not-used-anywhere-real-32chars
