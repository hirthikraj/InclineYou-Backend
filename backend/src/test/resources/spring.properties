# How many Spring test contexts the suite keeps open at once (20 Nov 2026).
#
# Every distinct test configuration is its own context, and a cached context keeps its Hikari pool open
# (spring.datasource.hikari.maximum-pool-size=4 in application.properties). Spring's default cache holds 32, so up to
# 128 connections against Postgres' default max_connections of 100. Each @MockitoSpyBean / @MockitoBean makes a test
# class's context distinct, and once enough of them were added the suite failed to start contexts with
# "FATAL: sorry, too many clients already". 16 keeps the suite under 64 connections; an evicted context is closed, and
# with it its pool. Raise it only with the pool size or the server limit in mind.
spring.test.context.cache.maxSize=16
