# The test suite connects as the schema OWNER, and that is a deliberate
# limitation rather than an oversight — write it down so the next person does not
# "fix" it by pointing the suite at inclineyou_app and spending a day on the fallout.
#
# 20 of the 26 test classes are @Transactional, which is what makes them clean up
# after themselves: Spring binds ONE connection for the whole test and rolls it
# back at the end. That single connection is borrowed before any request exists,
# so TenantAwareDataSource labels it with an empty context — and under row-level
# security an empty context is correctly worth nothing. Every fixture insert is
# refused, and so is every service call the test then makes through MockMvc,
# because they are all on that same unlabelled connection.
#
# Seeding through a second, owner-connected DataSource does not rescue it: a
# second connection is a second transaction, so fixtures stop rolling back and
# the next test finds the previous test's trainer sitting on its phone number.
#
# So the wall is proven where it can be proven honestly — TenantIsolationTest
# opens its own connections as inclineyou_app, labels them the way the filter does, and
# asserts what is and is not visible. The rest of the suite tests behaviour, not
# isolation. Making all 248 run behind the policies means giving the harness a
# way to set the six settings on an already-bound connection; it is real work and
# it has not been done.
#
# It reads the MIGRATION pair on purpose: the suite wants the owner, and the
# owner credential is exactly the credential migrations run under. There is no
# third identity to configure, and no way to point the suite at the app role by
# setting the app role's variables.
spring.datasource.username=${MIGRATION_DB_USERNAME:${DATABASE_USERNAME:inclineyou}}
spring.datasource.password=${MIGRATION_DB_PASSWORD:${DATABASE_PASSWORD:inclineyou_dev}}

# MockMvc sends every request from 127.0.0.1, so a suite that signs in a dozen
# different numbers looks exactly like the scripted flood OtpAbuseGuard blocks.
# The guard's own behaviour is pinned in OtpAbuseGuardTest, which builds it directly.
app.otp.abuse.max-numbers-per-ip=100000
app.otp.abuse.max-strikes-per-ip=100000
app.otp.abuse.new-numbers-per-day=100000

# The suite does NOT use Redis, locally or in CI. Locally it used to share the dev server's Redis, and that broke both ways:
# the OTP abuse guard keys on the caller's address, which for MockMvc and for a laptop is the same 127.0.0.1, so a block the dev
# server earned refused the suite's sign-ins and a block the suite earned locked the trainer out of their own dev sign-in; and a
# test that sets a tiny new-number budget left it in Redis for the next run to trip over (a 503 SIGNUPS_PAUSED). CI has no Redis
# and runs on the Postgres OTP store and in-process buckets, so this makes a local run the same as CI's, with state that starts
# fresh in every JVM.
app.redis.enabled=false

# Every distinct test context (each @Import of a capturing OtpSender is one) is cached for the whole run and keeps its own pool. At the
# default of ten each, fourteen-odd contexts plus a developer's own running backend pass Postgres's 100 connections and a context fails
# to load with "too many clients" — a failure in whichever class happens to load last. Four is plenty: a test is one thread.
spring.datasource.hikari.maximum-pool-size=4
