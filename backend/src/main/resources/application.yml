spring:
  application:
    name: trainx-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/trainxdb
    username: trainx
    password: trainx_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-before-production-32chars}
    expiry-minutes: 10080   # 7 days
  otp:
    expiry-minutes: 10
    sms-enabled: false       # stub in dev; set true + configure provider in prod
