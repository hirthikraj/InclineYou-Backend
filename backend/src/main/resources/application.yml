spring:
  application:
    name: trainx-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trainxdb}
    username: ${DATABASE_USERNAME:trainx}
    password: ${DATABASE_PASSWORD:trainx_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

logging:
  level:
    com.trainx: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-before-production-32chars}
    expiry-minutes: 10080   # 7 days
  otp:
    expiry-minutes: 10
    sms-enabled: false       # stub in dev; set true + configure provider in prod
  seed:
    exercises:
      enabled: ${SEED_EXERCISES:true}
      resource: seed/exercises.json
      # Point at your own bucket once images are mirrored (scripts/mirror-exercise-images.sh)
      image-base-url: ${EXERCISE_IMAGE_BASE_URL:https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises}
  fcm:
    # Raw service-account JSON, a file path, or classpath:… — blank disables push.
    credentials: ${FCM_CREDENTIALS:}
