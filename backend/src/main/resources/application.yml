spring:
  application:
    name: inclineyou-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/inclineyoudb}
    # THE REQUEST PATH. Connects as the NON-OWNING login, so row-level security
    # actually applies to it — Postgres exempts a table's owner from its own
    # policies, so connecting as the owner here would leave all 45 policies inert
    # while looking identical in every log.
    #
    # APP_DB_PASSWORD is deliberately the SAME variable V42's `appRolePassword`
    # placeholder below reads: the password this pool logs in with and the
    # password the migration sets on the role are one secret, and two names for
    # one secret is how a deployment sets one, misses the other, and cannot boot.
    #
    # Point APP_DB_USERNAME at the owner (`inclineyou`) to turn isolation off; that is
    # the whole kill switch, and it needs no migration.
    username: ${APP_DB_USERNAME:inclineyou_app}
    password: ${APP_DB_PASSWORD:inclineyou_app_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # TEMPORARY (25 Sep 2026): `none`, not `validate`. The schema was rebuilt as
      # a fresh v1 and the five JPA entities are being adapted to it module by
      # module; `validate` would refuse to boot until all five match. Flyway still
      # owns the schema. Put `validate` back once AppUser, Trainer, Client,
      # ClientNote and OtpRequest match the new tables.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway needs its own credentials now that the pool above is the app role.
    # DDL, the backfills and the seeds are owner work, and an owner is exactly
    # what RLS must not apply to — a migration that silently updated zero rows
    # because a policy hid them is the worst failure this schema can have.
    #
    # DATABASE_USERNAME / DATABASE_PASSWORD are read as a fallback because that
    # is what they have always meant everywhere they are set — an environment
    # that predates the split keeps migrating correctly, and only has to learn
    # the app role's two variables.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/inclineyoudb}
    user: ${MIGRATION_DB_USERNAME:${DATABASE_USERNAME:inclineyou}}
    password: ${MIGRATION_DB_PASSWORD:${DATABASE_PASSWORD:inclineyou_dev}}
    placeholders:
      # V42 creates the runtime login that row-level security actually applies
      # to. Flyway connects as the schema OWNER, which by design bypasses the
      # policies — see the note in V42 about why FORCE ROW LEVEL SECURITY is
      # deliberately not used. Set APP_DB_PASSWORD in any real deployment; the
      # default is a localhost-only development value, and it is the same
      # variable the pool above logs in with.
      appRolePassword: ${APP_DB_PASSWORD:inclineyou_app_dev}
      # The same value WITHOUT the development default, so the afterMigrate
      # callback can tell "set to the dev password" from "never configured".
      # It reconciles the role's password on every startup and must stay silent
      # in the second case — see afterMigrate__sync_app_role_password.sql.
      appRolePasswordExplicit: ${APP_DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        # Off for the compose Redis, which speaks plaintext on the loopback.
        # A managed Redis reached over a network must have this on and a
        # `rediss://` endpoint: the OTP wrong-attempt lock and the rate-limit
        # counters are abuse controls, and an attacker who can rewrite them on
        # the wire has turned "three attempts" into unlimited.
        enabled: ${REDIS_SSL:false}
      # Short on purpose. Redis is the fast path for sign-in and for every
      # request's rate-limit check, and both have a working Postgres/in-memory
      # fallback — so a slow Redis must fail over quickly rather than hold the
      # request thread. Waiting is the worse failure here.
      timeout: 250ms
      connect-timeout: 250ms
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 1

server:
  port: ${PORT:8080}
  # Set to `framework` behind a proxy (Railway) so getRemoteAddr() is the caller's
  # IP rather than the proxy's. The rate limiter keys authenticated requests by the
  # token's subject, so this only affects /v1/auth/** — where a shared proxy
  # address would otherwise put every trainer in one bucket.
  forward-headers-strategy: ${FORWARD_HEADERS:none}

logging:
  level:
    com.inclineyou: DEBUG

app:
  # The two database identities, and the difference between them IS the
  # isolation: a table owner bypasses its own policies, a non-owner does not.
  #
  #   APP_DB_USERNAME / APP_DB_PASSWORD              the request path — inclineyou_app
  #   MIGRATION_DB_USERNAME / MIGRATION_DB_PASSWORD  Flyway and the seeds — inclineyou
  #
  # Nothing but Flyway, the seed scripts and the test suite may use the second
  # pair. Everything a trainer's request touches goes through the first.
  #
  # These two mirror the pool's credentials rather than being a third identity:
  # `app-role` is the name the isolation tests connect under, and it must be the
  # role the pool actually logs in as or those tests prove nothing.
  database:
    app-role: ${APP_DB_USERNAME:inclineyou_app}
    app-role-password: ${APP_DB_PASSWORD:inclineyou_app_dev}
  redis:
    # The kill switch. Off — or unreachable — and everything falls back: OTP
    # state to `otp_request` in Postgres, rate limiting to the in-process
    # buckets. Nobody is locked out of signing in because a cache is down, and
    # the limits still hold, just per instance again.
    enabled: ${REDIS_ENABLED:true}
  security:
    # Redirect anything arriving over plaintext. Requires FORWARD_HEADERS=framework
    # to be set as well — behind a terminating proxy every request IS plaintext at
    # the container, and only X-Forwarded-Proto says otherwise, so turning this on
    # alone produces a redirect loop rather than security.
    require-https: ${REQUIRE_HTTPS:false}
    hsts-max-age-days: 365
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-before-production-32chars}
    expiry-minutes: 10080   # 7 days
  otp:
    expiry-minutes: 10
    sms-enabled: false       # stub in dev; set true + configure provider in prod
    # Print the code to the log. A separate decision from not sending it, because
    # a log is storage: shipped to an aggregator, retained, and read by more
    # people than the database. TransportSecurityCheck refuses to start when this
    # is on and the database connection is encrypted — the pair describes a real
    # deployment writing credentials to a log file.
    dev-codes-in-log: ${OTP_DEV_CODES_IN_LOG:true}
    max-attempts: 3
    lock-minutes: 10
    # Send rate per number. Counted from otp_request rows, so it survives a restart
    # and holds across instances — as does the wrong-attempt lock above, since V17.
    # The ladder mirrors RESEND_LADDER in the app.
    resend-ladder-seconds: [30, 60, 120]
    send-window-minutes: 60
    max-sends-per-day: 10
  # Requests per identity per window, per class of endpoint. Keyed by the token's
  # subject where there is one, by remote address on /v1/auth/**. In-memory and
  # per-instance by design — see AppProperties.RateLimit.
  rate-limit:
    # ON by default, because a ceiling that is off by default is one that is off
    # in production the first time somebody forgets a variable. The `dev`
    # profile below flips the DEFAULT only — RATE_LIMIT_ENABLED still wins
    # everywhere, so `RATE_LIMIT_ENABLED=true ./mvnw spring-boot:run` is how you
    # test the limiter itself.
    enabled: ${RATE_LIMIT_ENABLED:true}
    standard:  { limit: 120, window-seconds: 60 }
    auth:      { limit: 300, window-seconds: 60 }   # loose: may be keyed by a shared proxy IP
    sync:      { limit: 60,  window-seconds: 60 }
    messaging: { limit: 10,  window-seconds: 60 }   # each call spends a WhatsApp message

  # Team coaching. `enabled: false` makes every /v1/team/** endpoint 404 and
  # stops any caller's read scope widening — see AppProperties.Team. The seat
  # limit is enforced when an invite is ACCEPTED, not when it is sent, so seats
  # are consumed by people rather than by intentions.
  team:
    enabled: ${TEAM_ENABLED:true}
    default-seat-limit: ${TEAM_SEAT_LIMIT:5}
    invite-expiry-days: ${TEAM_INVITE_EXPIRY_DAYS:14}

  seed:
    exercises:
      enabled: ${SEED_EXERCISES:true}
      resource: seed/exercises.json
      # Text only. Upstream's thumbnails and demo GIFs are © Gym visual and need a
      # licence we do not hold, so no media is seeded and there is no base URL.
  fcm:
    # Raw service-account JSON, a file path, or classpath:… — blank disables push.
    credentials: ${FCM_CREDENTIALS:}

# ── The `dev` profile ────────────────────────────────────────────────────────
# Activated by `./mvnw spring-boot:run` (spring-boot-maven-plugin, see pom.xml)
# and by nothing else: a jar started with `java -jar` runs with no profile, so
# neither Railway nor CI can pick this up by accident.
---
spring:
  config:
    activate:
      on-profile: dev

app:
  rate-limit:
    # Off while developing. The limiter counts a whole laptop as one caller —
    # Expo, the Next dev server and a couple of curl loops all arrive as
    # `ip:127.0.0.1` until they are signed in — so 120/60s is spent by a hot
    # reload rather than by abuse, and the 429s that follow are indistinguishable
    # from a real bug in whatever screen you are working on.
    #
    # Still the same env flag: RATE_LIMIT_ENABLED=true turns it back on here.
    enabled: ${RATE_LIMIT_ENABLED:false}
