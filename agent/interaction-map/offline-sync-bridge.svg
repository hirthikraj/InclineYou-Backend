<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" role="img" aria-label="A set logged offline writes to the phone's local database, queues, pushes on reconnect, and reaches the other party's device on their next pull, announced by a push notification" class="dg"><style>
svg{color:#15162B;font-family:'DejaVu Sans Mono',Menlo,Consolas,monospace}
text{fill:currentColor}
.box{fill:none;stroke:currentColor;stroke-width:1.4}
.box-fill{fill:#F0F2F8;stroke:currentColor;stroke-width:1.4}
.ln{stroke:currentColor;stroke-width:1.4;fill:none}
.acc{stroke:#4F46E5;color:#4F46E5}
.acc-box{fill:#E9ECFF;stroke:#4F46E5;stroke-width:1.5}
.acc-txt{fill:#4F46E5}
.muted-txt{fill:#767D96}
.lbl{font-size:11px}
.ttl{font-size:13px;font-weight:600}
.sm{font-size:10.5px}
.dash{stroke-dasharray:5 4}
</style>
<rect width="920" height="240" fill="#FFFFFF"/>
        <defs>
          <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
          </marker>
          <marker id="ar4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/>
          </marker>
        </defs>
        <rect class="box-fill" x="20" y="70" width="180" height="76" rx="4"/>
        <text class="ttl" x="110" y="96" text-anchor="middle">Trainer's phone</text>
        <text class="sm muted-txt" x="110" y="114" text-anchor="middle">local SQLite write</text>
        <text class="sm acc-txt" x="110" y="130" text-anchor="middle">succeeds with no signal</text>

        <line class="ln" x1="200" y1="108" x2="290" y2="108" marker-end="url(#ar4)"/>
        <text class="lbl" x="245" y="98" text-anchor="middle">queue</text>

        <rect class="box" x="290" y="70" width="150" height="76" rx="4"/>
        <text class="ttl" x="365" y="102" text-anchor="middle">outbox</text>
        <text class="sm muted-txt" x="365" y="120" text-anchor="middle">client-made UUIDs</text>

        <line class="ln acc" x1="440" y1="108" x2="540" y2="108" marker-end="url(#ar4-a)"/>
        <text class="lbl acc-txt" x="490" y="98" text-anchor="middle">on reconnect</text>
        <text class="sm muted-txt" x="490" y="126" text-anchor="middle">idempotent push</text>

        <rect class="box-fill" x="540" y="70" width="160" height="76" rx="4"/>
        <text class="ttl" x="620" y="102" text-anchor="middle">server</text>
        <text class="sm muted-txt" x="620" y="120" text-anchor="middle">last write wins</text>

        <line class="ln" x1="700" y1="94" x2="790" y2="60" marker-end="url(#ar4)"/>
        <text class="lbl" x="748" y="58" text-anchor="end">push</text>
        <rect class="box" x="790" y="26" width="110" height="52" rx="4"/>
        <text class="ttl" x="845" y="50" text-anchor="middle">FCM</text>
        <text class="sm muted-txt" x="845" y="66" text-anchor="middle">announce</text>

        <line class="ln" x1="700" y1="122" x2="790" y2="160" marker-end="url(#ar4)"/>
        <rect class="box" x="790" y="140" width="110" height="60" rx="4"/>
        <text class="ttl" x="845" y="166" text-anchor="middle">Client's</text>
        <text class="ttl" x="845" y="182" text-anchor="middle">phone</text>
        <line class="ln dash" x1="845" y1="78" x2="845" y2="140" marker-end="url(#ar4)"/>

        <path class="ln dash" d="M110 146 L 110 200 L 620 200 L 620 146" marker-end="url(#ar4)"/>
        <text class="lbl" x="365" y="218" text-anchor="middle">pull on app foreground and on reconnect · incremental by updated_at</text>
      </svg>